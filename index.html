<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0, minimum-scale=1.0">
    <title>균균월드 (GyunWorld)</title>
    <style>
        /* ==================== 전역 스타일 및 초기화 ==================== */
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #111;
            font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
        }

        /* ==================== 게임 화면 레이아웃 ==================== */
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        canvas {
            background-color: #222;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
            display: block;
        }

        /* ==================== 모바일 UI (조이스틱) ==================== */
        #joystick-zone {
            position: absolute;
            bottom: 40px;
            left: 40px;
            width: 150px;
            height: 150px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            display: none; 
            touch-action: none;
            z-index: 10;
        }
        #joystick-stick {
            position: absolute;
            width: 60px;
            height: 60px;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            top: 45px;
            left: 45px;
        }

        /* ==================== 상단 UI (상태창) ==================== */
        #ui-layer {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            pointer-events: none;
            z-index: 5;
        }
        .ui-box {
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            padding: 10px 18px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.2);
            font-size: 16px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 10px;
            pointer-events: auto;
        }
        .coin-icon { color: #ffd700; }
        .time-icon { color: #87ceeb; }

        /* ==================== 대화창 시스템 ==================== */
        #dialogue-box {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 700px;
            height: 130px;
            background: rgba(20, 20, 25, 0.95);
            border: 3px solid #555;
            border-radius: 10px;
            padding: 15px 20px;
            color: white;
            display: none;
            z-index: 100;
            cursor: pointer;
        }
        #dialogue-name {
            font-size: 18px;
            font-weight: bold;
            color: #ffeb3b;
            margin-bottom: 5px;
        }
        #dialogue-text {
            font-size: 16px;
            line-height: 1.4;
        }

        /* ==================== 로딩 화면 레이아웃 ==================== */
        #loading-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: #0b0f19;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 200;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }
        #loading-screen.active {
            opacity: 1;
            pointer-events: auto;
        }
        .game-profile-logo {
            text-align: center;
            margin-bottom: 50px;
        }
        .game-profile-logo h1 {
            font-size: 42px;
            color: #2ecc71;
            text-shadow: 0 0 15px rgba(46, 204, 113, 0.6);
            letter-spacing: 4px;
            margin-bottom: 10px;
        }
        .game-profile-logo p {
            font-size: 16px;
            color: #888;
        }
        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255,255,255,0.1);
            border-top: 4px solid #2ecc71;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 60px;
        }
        .tip-box {
            position: absolute;
            bottom: 60px;
            background: rgba(255,255,255,0.05);
            border-left: 4px solid #2ecc71;
            padding: 15px 25px;
            max-width: 600px;
            width: 80%;
            border-radius: 0 8px 8px 0;
        }
        .tip-title {
            font-size: 13px;
            color: #2ecc71;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .tip-text {
            font-size: 15px;
            color: #ddd;
            line-height: 1.4;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas"></canvas>

    <!-- 상단 HUD 레이어 -->
    <div id="ui-layer">
        <div class="ui-box" id="info-hud">
            <div><span class="time-icon">⏰</span> <span id="hud-time">오전 06:00</span></div>
            <div><span style="color:#a8ffb2;">🌤️</span> <span id="hud-weather">맑음</span></div>
            <div><span style="color:#ff7676;">📍</span> <span id="hud-map">내 방</span></div>
        </div>
        <div class="ui-box" id="wallet-hud">
            <span class="coin-icon">🪙</span> <span id="hud-coin">0</span> 원
        </div>
    </div>

    <!-- 모바일 터치 패드 조이스틱 -->
    <div id="joystick-zone">
        <div id="joystick-stick"></div>
    </div>

    <!-- RPG 대화 레이어 -->
    <div id="dialogue-box" onclick="DialogueSystem.next()">
        <div id="dialogue-name">이름</div>
        <div id="dialogue-text">대사 내용</div>
    </div>

    <!-- 3초 버스 등교 로딩 연출 화면 -->
    <div id="loading-screen">
        <div class="game-profile-logo">
            <h1>GYUN WORLD</h1>
            <p>버스를 타고 학교로 이동하는 중...</p>
        </div>
        <div class="loading-spinner"></div>
        <div class="tip-box">
            <div class="tip-title">등교 가이드 팁</div>
            <div class="tip-text" id="loading-tip-text">팁 불러오는 중...</div>
        </div>
    </div>
</div>

<script>
// ============================================================================
// 데이터 관리 및 저장 시스템 (LocalStorage)
// ============================================================================
const SaveManager = {
    SAVE_KEY: "GYUNWORLD_SAVE_DATA_V7",
    
    defaultData: {
        player: { coin: 1000, inventory: [], currentMap: "myRoom", x: 400, y: 300 },
        env: { time: "오전 06:00", weather: "맑은 날" },
        unlockedTriggers: []
    },

    save(customData) {
        localStorage.setItem(this.SAVE_KEY, JSON.stringify(customData));
    },

    load() {
        const rawData = localStorage.getItem(this.SAVE_KEY);
        if (!rawData) return JSON.parse(JSON.stringify(this.defaultData));
        try { 
            let parsed = JSON.parse(rawData);
            parsed.player.currentMap = "myRoom";
            parsed.player.x = 400;
            parsed.player.y = 300;
            parsed.env.time = "오전 06:00";
            return parsed;
        } catch (e) { 
            return JSON.parse(JSON.stringify(this.defaultData)); 
        }
    }
};

// ============================================================================
// 글로벌 게임 상태 관리 객체 (Global Engine State)
// ============================================================================
const Game = {
    canvas: null, ctx: null, data: null, scale: 1, baseWidth: 1280, baseHeight: 720, isMobile: false,
    input: { x: 0, y: 0, keys: {} },
    isLoading: false,

    init() {
        this.canvas = document.getElementById("gameCanvas");
        this.ctx = this.canvas.getContext("2d");
        this.data = SaveManager.load();
        
        this.checkDevice();
        this.resizeCanvas();
        window.addEventListener("resize", () => this.resizeCanvas());

        InputManager.init();
        MapManager.init();
        
        if (this.isMobile) {
            document.getElementById("joystick-zone").style.display = "block";
        }

        this.updateHUD();
        window.requestAnimationFrame((timestamp) => this.loop(timestamp));
    },

    teleport(mapId) {
        if (MapManager.maps[mapId]) {
            console.log(`${mapId} 구역으로 강제 이동합니다.`);
            MapManager.changeMap(mapId, true);
        } else {
            console.warn(`존재하지 않는 맵 ID입니다: ${mapId}`);
        }
    },

    checkDevice() {
        const userAgent = navigator.userAgent || navigator.vendor || window.opera;
        if (/android|avantgo|bada\/|blackberry|blazer|compal|elaine|fennec|hiptop|iemobile|ip(hone|od|ad)|iris|kindle|lge |maemo|midp|mmp|opera m(ob|in)i|palm( os)?|phone|p(ixi|re)\/|plucker|pocket|psp|series(4|6)0|symbian|treo|up\.(browser|link)|vodafone|wap|windows ce|xda|xiino/i.test(userAgent)) {
            this.isMobile = true;
        }
    },

    resizeCanvas() {
        const windowWidth = window.innerWidth;
        const windowHeight = window.innerHeight;
        let targetWidth = windowWidth;
        let targetHeight = windowWidth * (this.baseHeight / this.baseWidth);

        if (targetHeight > windowHeight) {
            targetHeight = windowHeight;
            targetWidth = windowHeight * (this.baseWidth / this.baseHeight);
        }

        this.canvas.width = this.baseWidth;
        this.canvas.height = this.baseHeight;
        this.canvas.style.width = `${targetWidth}px`;
        this.canvas.style.height = `${targetHeight}px`;
        this.scale = targetWidth / this.baseWidth;
    },

    updateHUD() {
        document.getElementById("hud-time").innerText = this.data.env.time;
        document.getElementById("hud-weather").innerText = this.data.env.weather;
        document.getElementById("hud-coin").innerText = this.data.player.coin.toLocaleString();
        
        const mapNames = {
            "myRoom": "내 방", "livingRoom": "거실", "entrance": "현관",
            "corridor": "아파트 복도", "elevator": "엘리베이터", "floor1": "아파트 1층",
            "outside": "아파트 밖", "convenienceZone": "편의점 길목", "convenienceStore": "편의점 내부",
            "busStop": "버스 정류장", "schoolFront": "학교 앞", 
            "school1F": "학교 1층 복도", "school2F": "학교 2층 복도", "school3F": "학교 3층 대음악실",
            "room_class1": "1학년 교실 내부", "room_art": "미술실 내부", "room_tech": "기술가정실 내부",
            "room_principal": "교장실 내부", "room_support": "통합지원반 내부", "room_medical": "보건실 내부", "room_library": "도서관 내부",
            "room_staff": "교무실 내부", "room_class2": "2학년 교실 내부", "room_class3": "3학년 교실 내부",
            "room_computer": "컴퓨터실 내부", "room_career": "진로상담실 내부", "room_weclass": "상담실 내부",
            "room_council": "학생자치회실 내부", "room_science": "과학실 내부"
        };
        document.getElementById("hud-map").innerText = mapNames[this.data.player.currentMap] || "알 수 없음";
    },

    startBusLoading(targetMapId) {
        this.isLoading = true;
        Game.input.x = 0; Game.input.y = 0;

        const tips = [
            "학주 선생님에게 걸리면 벌점을 받으니 8시 30분 전까지 무조건 입실하세요.",
            "새로 리뉴얼된 학교 3층 대음악실은 전교생이 모일 수 있을 만큼 거대합니다.",
            "1층 보건실에 가면 아픈 곳을 치료받거나 잠시 쉴 수 있습니다.",
            "2층 교무실 근처를 지나갈 때는 항상 조용히 보행해야 합니다."
        ];
        const randomTip = tips[Math.floor(Math.random() * tips.length)];
        document.getElementById("loading-tip-text").innerText = randomTip;

        const screen = document.getElementById("loading-screen");
        screen.classList.add("active");

        setTimeout(() => {
            this.data.env.time = "오전 08:20"; 
            MapManager.changeMap(targetMapId, true);
            screen.classList.remove("active");
            this.isLoading = false;
        }, 3000);
    },

    update(dt) {
        if (this.isLoading) return;
        Player.update(dt);
        Camera.update();
        MapManager.update(dt);
    },

    render() {
        this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
        
        this.ctx.save();
        this.ctx.translate(Math.floor(this.canvas.width/2 - Camera.x), Math.floor(this.canvas.height/2 - Camera.y));
        
        MapManager.renderBackground(this.ctx);
        
        const renderQueue = [];
        renderQueue.push(Player);
        renderQueue.sort((a, b) => a.y - b.y);
        renderQueue.forEach(entity => entity.render(this.ctx));

        this.ctx.restore();
    },

    lastTime: 0,
    loop(timestamp) {
        if (!this.lastTime) this.lastTime = timestamp;
        let dt = (timestamp - this.lastTime) / 1000;
        if (dt > 0.1) dt = 0.1; 
        this.lastTime = timestamp;

        this.update(dt);
        this.render();

        window.requestAnimationFrame((timestamp) => this.loop(timestamp));
    }
};

// ============================================================================
// 입력 관리 매니저 (InputManager)
// ============================================================================
const InputManager = {
    init() {
        window.addEventListener("keydown", (e) => {
            if (Game.isLoading) return;
            const key = e.key.toLowerCase();
            Game.input.keys[key] = true;
            this.updateKeyboardVector();
            
            if (key === "f" || e.key === " ") {
                ObjectManager.checkInteraction();
                NPCManager.checkNPCInteraction();
            }
        });

        window.addEventListener("keyup", (e) => {
            const key = e.key.toLowerCase();
            Game.input.keys[key] = false;
            this.updateKeyboardVector();
        });

        window.addEventListener("pointerdown", (e) => {
            if (DialogueSystem.isActive) return;
            if (Game.isLoading) return;
            if (e.clientX > 220) {
                ObjectManager.checkInteraction();
                NPCManager.checkNPCInteraction();
            }
        });

        const zone = document.getElementById("joystick-zone");
        const stick = document.getElementById("joystick-stick");
        let startX = 0, startY = 0;
        let maxRadius = 45;

        zone.addEventListener("touchstart", (e) => {
            const touch = e.touches[0];
            const rect = zone.getBoundingClientRect();
            startX = rect.left + rect.width / 2;
            startY = rect.top + rect.height / 2;
        });

        zone.addEventListener("touchmove", (e) => {
            if (Game.isLoading) return;
            e.preventDefault();
            const touch = e.touches[0];
            let moveX = touch.clientX - startX;
            let moveY = touch.clientY - startY;
            let distance = Math.sqrt(moveX * moveX + moveY * moveY);

            if (distance > maxRadius) {
                moveX = (moveX / distance) * maxRadius;
                moveY = (moveY / distance) * maxRadius;
                distance = maxRadius;
            }

            stick.style.transform = `translate(${moveX}px, ${moveY}px)`;
            Game.input.x = moveX / maxRadius;
            Game.input.y = moveY / maxRadius;
        });

        zone.addEventListener("touchend", () => {
            stick.style.transform = "translate(0px, 0px)";
            Game.input.x = 0;
            Game.input.y = 0;
        });
    },

    updateKeyboardVector() {
        let vx = 0; let vy = 0;
        if (Game.input.keys["w"] || Game.input.keys["arrowup"]) vy -= 1;
        if (Game.input.keys["s"] || Game.input.keys["arrowdown"]) vy += 1;
        if (Game.input.keys["a"] || Game.input.keys["arrowleft"]) vx -= 1;
        if (Game.input.keys["d"] || Game.input.keys["arrowright"]) vx += 1;

        if (vx !== 0 && vy !== 0) { vx *= 0.7071; vy *= 0.7071; }
        Game.input.x = vx;
        Game.input.y = vy;
    }
};

// ============================================================================
// 카메라 제어 시스템 (Camera)
// ============================================================================
const Camera = {
    x: 0, y: 0, lerpFactor: 0.1,
    init() { this.x = Player.x; this.y = Player.y; },
    update() {
        this.x += (Player.x - this.x) * this.lerpFactor;
        this.y += (Player.y - this.y) * this.lerpFactor;
        if (MapManager.current) {
            const minX = Game.baseWidth / 2; const minY = Game.baseHeight / 2;
            const maxX = MapManager.current.width - Game.baseWidth / 2;
            const maxY = MapManager.current.height - Game.baseHeight / 2;
            if (MapManager.current.width < Game.baseWidth) this.x = MapManager.current.width / 2;
            else { if (this.x < minX) this.x = minX; if (this.x > maxX) this.x = maxX; }
            if (MapManager.current.height < Game.baseHeight) this.y = MapManager.current.height / 2;
            else { if (this.y < minY) this.y = minY; if (this.y > maxY) this.y = maxY; }
        }
    }
};

// ============================================================================
// 플레이어 엔티티 (Player)
// ============================================================================
const Player = {
    x: 0, y: 0, width: 40, height: 40, speed: 280,
    init() {
        if (MapManager.current && MapManager.current.spawnPoints) {
            this.x = MapManager.current.spawnPoints.x; this.y = MapManager.current.spawnPoints.y;
        }
    },
    update(dt) {
        if (DialogueSystem.isActive) return;
        const vx = Game.input.x; const vy = Game.input.y;
        if (vx !== 0 || vy !== 0) {
            const nextX = this.x + vx * this.speed * dt;
            if (!this.checkCollision(nextX, this.y)) this.x = nextX;
            const nextY = this.y + vy * this.speed * dt;
            if (!this.checkCollision(this.x, nextY)) this.y = nextY;
            Game.data.player.x = this.x; Game.data.player.y = this.y;
        }
    },
    checkCollision(targetX, targetY) {
        const left = targetX - this.width / 2; const right = targetX + this.width / 2;
        const top = targetY - this.height / 2; const bottom = targetY + this.height / 2;
        if (!MapManager.current) return false;
        if (left < 0 || right > MapManager.current.width || top < 0 || bottom > MapManager.current.height) return true;
        const colliders = MapManager.current.colliders || [];
        for (let i = 0; i < colliders.length; i++) {
            const wall = colliders[i];
            if (right > wall.x && left < wall.x + wall.w && bottom > wall.y && top < wall.y + wall.h) return true;
        }
        return false;
    },
    render(ctx) {
        ctx.save();
        ctx.fillStyle = "#2ecc71";
        ctx.beginPath(); ctx.arc(this.x, this.y, this.width / 2, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = "#ffffff";
        ctx.beginPath(); ctx.arc(this.x - 8, this.y - 4, 5, 0, Math.PI * 2); ctx.arc(this.x + 8, this.y - 4, 5, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = "#000000";
        ctx.beginPath(); ctx.arc(this.x - 8, this.y - 4, 2, 0, Math.PI * 2); ctx.arc(this.x + 8, this.y - 4, 2, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
    }
};

// ============================================================================
// 대화 연출 시스템 (DialogueSystem)
// ============================================================================
const DialogueSystem = {
    isActive: false, list: [], index: 0, callback: null,
    start(dialogues, onComplete = null) {
        this.list = dialogues; this.index = 0; this.isActive = true; this.callback = onComplete;
        document.getElementById("dialogue-box").style.display = "block";
        this.show();
    },
    show() {
        if (this.index >= this.list.length) { this.close(); return; }
        const current = this.list[this.index];
        document.getElementById("dialogue-name").innerText = current.name;
        document.getElementById("dialogue-text").innerText = current.text;
    },
    next() { this.index++; this.show(); },
    close() {
        this.isActive = false;
        document.getElementById("dialogue-box").style.display = "none";
        if (this.callback) this.callback();
    }
};

// ============================================================================
// 상호작용 매니저 (ObjectManager)
// ============================================================================
const ObjectManager = {
    checkInteraction() {
        if (DialogueSystem.isActive || Game.isLoading) return;
        const currentMap = MapManager.current;
        if (!currentMap || !currentMap.objects) return;
        
        for (let i = 0; i < currentMap.objects.length; i++) {
            const obj = currentMap.objects[i];
            const radius = obj.interactRadius || 85; 
            const dist = Math.sqrt((Player.x - obj.x) ** 2 + (Player.y - obj.y) ** 2);
            if (dist < radius) {
                if (obj.onInteract) obj.onInteract();
                else DialogueSystem.start(obj.dialogues);
                break;
            }
        }
    },
    render(ctx, objects) {
        if (!objects) return;
        objects.forEach(obj => {
            ctx.save();
            ctx.fillStyle = obj.color || "#e67e22";
            ctx.fillRect(obj.x - obj.w/2, obj.y - obj.h/2, obj.w, obj.h);
            ctx.strokeStyle = "rgba(255,255,255,0.2)"; ctx.lineWidth = 2;
            ctx.strokeRect(obj.x - obj.w/2, obj.y - obj.h/2, obj.w, obj.h);

            const radius = obj.interactRadius || 85;
            const dist = Math.sqrt((Player.x - obj.x) ** 2 + (Player.y - obj.y) ** 2);
            if (dist < radius && !DialogueSystem.isActive) {
                ctx.fillStyle = "#ffeb3b"; ctx.font = "bold 15px sans-serif"; ctx.textAlign = "center";
                ctx.fillText(`[F] ${obj.actionName || '조사하기'}`, obj.x, obj.y - obj.h/2 - 12);
            } else {
                ctx.fillStyle = "rgba(255,255,255,0.7)"; ctx.font = "12px sans-serif"; ctx.textAlign = "center";
                ctx.fillText(obj.name, obj.x, obj.y - obj.h/2 - 6);
            }
            ctx.restore();
        });
    }
};

// ============================================================================
// NPC 관리 및 레이어 매니저 (NPCManager)
// ============================================================================
const NPCManager = {
    interactRadius: 75,
    checkNPCInteraction() {
        if (DialogueSystem.isActive || Game.isLoading) return;
        const currentMap = MapManager.current;
        if (!currentMap || !currentMap.npcs) return;
        for (let i = 0; i < currentMap.npcs.length; i++) {
            const npc = currentMap.npcs[i];
            const dist = Math.sqrt((Player.x - npc.x) ** 2 + (Player.y - npc.y) ** 2);
            if (dist < this.interactRadius) {
                DialogueSystem.start(npc.dialogues);
                break;
            }
        }
    },
    render(ctx, npcs) {
        if (!npcs) return;
        npcs.forEach(npc => {
            ctx.save();
            ctx.fillStyle = npc.color || "#e74c3c";
            ctx.beginPath(); ctx.arc(npc.x, npc.y, 20, 0, Math.PI * 2); ctx.fill();

            const dist = Math.sqrt((Player.x - npc.x) ** 2 + (Player.y - npc.y) ** 2);
            if (dist < this.interactRadius && !DialogueSystem.isActive) {
                ctx.fillStyle = "#5dade2"; ctx.font = "bold 13px sans-serif"; ctx.textAlign = "center";
                ctx.fillText("[F] 대화하기", npc.x, npc.y - 42);
            }
            ctx.fillStyle = "#fff"; ctx.font = "bold 13px sans-serif"; ctx.textAlign = "center";
            ctx.fillText(npc.name, npc.x, npc.y - 26);
            ctx.restore();
        });
    }
};

const MapManager = {
    current: null, maps: {}, triggeredEvents: {},
    init() {
        this.buildWorldData();
        if (!Game.data.unlockedTriggers) Game.data.unlockedTriggers = [];
        Game.data.unlockedTriggers.forEach(id => this.triggeredEvents[id] = true);
        this.changeMap("myRoom", false);
    },
    changeMap(mapId, useSpawnInfo = true) {
        if (!this.maps[mapId]) return;
        this.current = this.maps[mapId];
        Game.data.player.currentMap = mapId;
        if (this.current.spawnPoints) {
            Player.x = this.current.spawnPoints.x; Player.y = this.current.spawnPoints.y;
        }
        Game.updateHUD(); Camera.init(); SaveManager.save(Game.data);

        if (this.current.forcedEvent && !this.triggeredEvents[this.current.forcedEvent.id]) {
            const eventId = this.current.forcedEvent.id;
            this.triggeredEvents[eventId] = true; Game.data.unlockedTriggers.push(eventId);
            setTimeout(() => { DialogueSystem.start(this.current.forcedEvent.dialogues, () => SaveManager.save(Game.data)); }, 300);
        }
    },
    update(dt) {
        if (!this.current || Game.isLoading) return;
        const portals = this.current.portals || [];
        for (let i = 0; i < portals.length; i++) {
            const p = portals[i];
            const dist = Math.sqrt((Player.x - p.x) ** 2 + (Player.y - p.y) ** 2);
            if (dist < p.radius) {
                this.changeMap(p.targetMap, true); break;
            }
        }
    },
    renderBackground(ctx) {
        if (!this.current) return;
        ctx.fillStyle = this.current.bgColor || "#2c3e50"; ctx.fillRect(0, 0, this.current.width, this.current.height);
        ctx.strokeStyle = "rgba(255,255,255,0.03)"; ctx.lineWidth = 1;
        for (let x = 0; x < this.current.width; x += 50) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, this.current.height); ctx.stroke(); }
        for (let y = 0; y < this.current.height; y += 50) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(this.current.width, y); ctx.stroke(); }
        ctx.fillStyle = this.current.wallColor || "#34495e"; (this.current.colliders || []).forEach(w => ctx.fillRect(w.x, w.y, w.w, w.h));
        ObjectManager.render(ctx, this.current.objects); NPCManager.render(ctx, this.current.npcs);
        (this.current.portals || []).forEach(p => {
            ctx.strokeStyle = p.color || "rgba(52, 152, 219, 0.7)"; ctx.lineWidth = 3;
            ctx.beginPath(); ctx.arc(p.x, p.y, p.radius, 0, Math.PI*2); ctx.stroke();
            ctx.fillStyle = p.fillColor || "rgba(52, 152, 219, 0.2)"; ctx.fill();
            ctx.fillStyle = "#fff"; ctx.font = "bold 13px sans-serif"; ctx.textAlign = "center";
            ctx.fillText(p.label || "이동", p.x, p.y - p.radius - 5);
        });
    },
